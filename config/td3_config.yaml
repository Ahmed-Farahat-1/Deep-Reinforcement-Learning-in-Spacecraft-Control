# Deep Reinforcement Learning (TD3) Training & Configuration
# Spacecraft Attitude Stabilization Project

environment:
  id: "SpacecraftAttitude-v0"
  time_step: 0.01             # Simulation step dt (seconds)
  max_episode_steps: 3000     # 30.0 seconds at dt = 0.01s
  max_duration_seconds: 30.0

  observation:
    theta_scale: 3.14159265   # pi rad (180 deg)
    theta_dot_scale: 2.10     # 2.10 rad/s (120.3 deg/s)
    Omega_scale: 523.6        # 523.6 rad/s (5000 RPM)
    clip_obs: true
    include_integral: true    # 4D state space [theta, theta_dot, Omega, z]
    z_scale: 1.0              # 1.0 rad*s
    z_max: 1.0                # Clamping anti-windup limit (rad*s)
    anti_windup: true         # Enable freezing under actuator saturation

  action:
    low: -1.0
    high: 1.0
    max_torque: 1.0           # Maximum motor torque (N*m)

  reward_weights:
    reward_type: "huber"
    huber_delta: 0.05
    w_theta: 1.0
    w_theta_dot: 0.1
    w_effort: 0.001
    w_omega: 0.005
    omega_warn: 471.24        # 4500 RPM (90% of Omega_max)
    w_torque_sat: 0.05
    w_wheel_sat: 1.00
    w_blocked_torque: 0.20
    w_bonus: 0.50
    w_z: 0.05

  reward_scaling:
    theta_ref: 0.52359877     # 30 deg in rad
    theta_dot_ref: 0.10       # 0.1 rad/s
    u_ref: 1.0
    omega_ref: 523.6
    tolerance_theta: 0.0174533    # 1.0 deg in rad
    tolerance_theta_dot: 0.00174533 # 0.10 deg/s in rad

  initial_conditions:
    randomize: false
    theta_range_deg: [-30.0, 30.0]
    theta_dot_range_deg: [-3.0, 3.0]
    Omega_range_rpm: [-500.0, 500.0]

  max_initial_momentum: 10.0   # Physical feasibility bound: |H_0| <= 10.0 N*m*s

  termination:
    failure_theta_deg: 90.0
    failure_theta_dot_deg: 120.0
    terminate_on_wheel_sat: false

# TD3 Hyperparameters (Twin Delayed Deep Deterministic Policy Gradient)
td3:
  learning_rate: 0.0003
  buffer_size: 500000
  learning_starts: 10000
  batch_size: 256
  tau: 0.005
  gamma: 0.998
  train_freq: 1
  gradient_steps: 4
  policy_delay: 2
  target_policy_noise: 0.2
  target_noise_clip: 0.5
  action_noise_sigma: 0.15
  n_envs: 4
  device: "cpu"
  policy_type: "AntiSymmetricTD3Policy"
  net_arch: [64, 64]
  include_integral: true

training_scenarios:
  distribution:
    step_response: 0.35
    constant_dist: 0.25
    sinusoidal_dist: 0.20
    pulse_dist: 0.10
    near_sat_stress: 0.10
